source = $HOME/.config/hypr/frappe.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
  grace = 1
}

# BACKGROUND
background {
  monitor =
  path = $HOME/Pictures/Wallpapers/Forest 2.png
  blur_passes = 0
  color = $base
}

# LAYOUT
label {
  monitor =
  text = $LAYOUT
  color = $text
  font_size = 28
  font_family = $font
  position = -60, 60
  halign = right
  valign = bottom
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 180
  font_family = $font
  position = -60, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 50
  font_family = $font
  position = -60, -300
  halign = right
  valign = top
}

# USER AVATAR
#image {
#  monitor =
#  path = $HOME/.face
#  size = 200
#  border_color = $accent
#  position = 0, 150
#  halign = center
#  valign = center
#}

# INPUT FIELD
input-field {
  monitor =
  size = 600, 120
  outline_thickness = 8
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -94
  halign = center
  valign = center
}
