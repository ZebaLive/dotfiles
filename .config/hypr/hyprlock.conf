source = $HOME/.config/hypr/frappe.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
}

# Authentication configuration
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    fingerprint:ready_message = <span foreground="##$accentAlpha"><i> Touch fingerprint sensor to unlock</i></span>
    fingerprint:present_message = <span foreground="##$yellowAlpha"><i>󰦖 Scanning fingerprint...</i></span>
}

# BACKGROUND - Laptop monitor only (lockscreen)
background {
  monitor = eDP-1
  path = $HOME/Pictures/Wallpapers/Forest 2.png
  blur_passes = 0
  color = $base
}

# BACKGROUND - USB monitor (just wallpaper, no lockscreen elements)
background {
  monitor = DP-3
  path = $HOME/Pictures/Wallpapers/Forest 2.png
  blur_passes = 0
  color = $base
}

# LAYOUT - Laptop monitor only
label {
  monitor = eDP-1
  text = $LAYOUT
  color = $text
  font_size = 28
  font_family = $font
  position = -60, 60
  halign = right
  valign = bottom
}

# TIME - Laptop monitor only
label {
  monitor = 
  text = $TIME
  color = $text
  font_size = 180
  font_family = $font
  position = -60, 0
  halign = right
  valign = top
}

# DATE - Laptop monitor only
label {
  monitor = 
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 50
  font_family = $font
  position = -60, -300
  halign = right
  valign = top
}

# FINGERPRINT STATUS - Laptop monitor only
label {
  monitor = eDP-1
  text = $FPRINTPROMPT
  color = $accent
  font_size = 24
  font_family = $font
  position = 0, -200
  halign = center
  valign = center
}

# USER AVATAR - Laptop monitor only
image {
 monitor = eDP-1
 path = $HOME/.face.icon
 size = 200
 border_color = $accent
 position = 0, 100
 halign = center
 valign = center
}

# INPUT FIELD - Laptop monitor only
input-field {
  monitor = eDP-1
  size = 600, 120
  outline_thickness = 8
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -94
  halign = center
  valign = center
}
